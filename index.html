<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#030817" />

    <!-- Primary SEO Title -->
    <title>
      Vinay Kumar | Full Stack Developer & Cloud Computing
    </title>

    <!-- SEO Meta Description -->
    <meta
      name="description"
      content="Vinay Kumar is a Full Stack Developer specializing in MERN Stack, AWS and Cloud Computing. Explore web development projects, technical skills, cloud technologies and certifications."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="Vinay Kumar, Full Stack Developer, Cloud Computing, MERN Stack Developer, AWS Developer, Cloud Engineer, React Developer, Node.js Developer, MongoDB, Express.js"
    />

    <!-- Author -->
    <meta name="author" content="Vinay Kumar" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://iamvinaykumar.com/"
    />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://iamvinaykumar.com/"
    />
    <meta
      property="og:title"
      content="Vinay Kumar | Full Stack Developer & Cloud Computing"
    />
    <meta
      property="og:description"
      content="Explore Vinay Kumar's portfolio featuring MERN Stack development, AWS, Cloud Computing, projects and technical skills."
    />
    <meta
      property="og:image"
      content="https://iamvinaykumar.com/og-image.png"
    />
    <meta
      property="og:image:width"
      content="1200"
    />
    <meta
      property="og:image:height"
      content="630"
    />
    <meta
      property="og:image:alt"
      content="Vinay Kumar - Full Stack Developer, MERN Stack, AWS and Cloud Computing"
    />
    <meta property="og:site_name" content="Vinay Kumar Portfolio" />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary_large_image"
    />
    <meta
      name="twitter:title"
      content="Vinay Kumar | Full Stack Developer & Cloud Computing"
    />
    <meta
      name="twitter:description"
      content="Explore my portfolio, MERN Stack projects, AWS skills and Cloud Computing experience."
    />
    <meta
      name="twitter:image"
      content="https://iamvinaykumar.com/og-image.png"
    />

    <!-- Fonts Optimization -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <!-- React Application -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
